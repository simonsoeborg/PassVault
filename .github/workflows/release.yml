# Builds PassVault for Linux, macOS and Windows and attaches the installers to
# a GitHub release. Pushing a tag like v0.1.0-rc.1 (anything with a hyphen)
# publishes a pre-release; a plain v0.1.0 publishes a full release.
#
# Builds are unsigned. macOS gets an ad-hoc signature so it runs on Apple
# Silicon, but Gatekeeper and Touch ID still need a real Developer ID.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0-rc.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            dist: --linux --x64
          - name: macos
            os: macos-latest
            dist: --mac --arm64 --x64 --config.mac.identity=-
          - name: windows
            os: windows-latest
            dist: --win --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # needs, and there is no display; lift the first and fake the second.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a npm run smoke

      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run smoke

      - name: Package
        run: npx electron-builder ${{ matrix.dist }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v5
        with:
          name: passvault-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" artifacts/* \
            --title "PassVault ${TAG#v}" \
            --generate-notes \
            $prerelease
