# Permanent. macOS ties Keychain access to it and Windows derives the
# installer's identity from it, so changing it later makes a new app.
appId: dk.sobo.passvault
productName: PassVault
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true

# Close the doors Electron leaves open in a packaged app.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

mac:
  # Name both builds by architecture: the default leaves the Intel one without
  # a suffix, so it looks like the one to download and runs under Rosetta on
  # Apple Silicon Macs.
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.utilities
  # Opened from Finder, the app can get a stdout/stderr that fails on write,
  # and a Node warning printed there becomes a blocking "Uncaught Exception:
  # write EIO" box before the main script has run. LaunchServices applies
  # this before Node starts, so warnings are never printed; the main process
  # still logs them to ~/Library/Logs/PassVault/main.log.
  extendInfo:
    LSEnvironment:
      NODE_NO_WARNINGS: '1'
  target:
    - dmg
    - zip
  # Signed with a Developer ID and notarized. Gatekeeper opens the app without
  # a warning, and Touch ID works: macOS refuses biometric unlock to code
  # without a real signature.
  #
  # The certificate is found in the keychain: the login keychain on a Mac
  # where it is installed, and one the release workflow creates in CI.
  # Notarization runs when APPLE_API_KEY, APPLE_API_KEY_ID and
  # APPLE_API_ISSUER are set and is skipped otherwise, so a local test build
  # does not wait on Apple.
  #
  # forceCodeSigning makes a missing certificate fail the build instead of
  # quietly producing an app that Gatekeeper blocks and Touch ID ignores.
  hardenedRuntime: true
  forceCodeSigning: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

win:
  target:
    - nsis
  # Windows Hello is reached through Windows PowerShell; no extra permissions.

nsis:
  # The default name has spaces, which GitHub turns into dots on upload, so
  # the installer would no longer match its line in SHA256SUMS.txt.
  artifactName: ${productName}-Setup-${version}.${ext}

linux:
  # Hand-tuned sizes from scripts/icons.mjs; the small ones use the rosette's
  # low-lobe format so they do not fill in when downscaled.
  icon: build/icons
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Local-first password and SSH vault
  maintainer: simonsoeborg <simonsoeborg1@gmail.com>
